name: Update outbreak feed

on:
  workflow_dispatch:
  schedule:
    - cron: "45 15 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update JSON feed from ECDC
        run: swift Scripts/update-current-outbreak.swift

      - name: Commit updated feed
        run: |
          if git diff --quiet docs/current-outbreak.json; then
            echo "No data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-outbreak.json
          git commit -m "Update outbreak feed"
          git push
